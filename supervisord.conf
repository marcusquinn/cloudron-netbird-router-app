[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; The NetBird daemon needs root for NET_ADMIN (WireGuard interface, routes, firewall).
[program:netbird]
command=/app/code/bin/netbird service run
environment=NB_STATE_DIR="/app/data/netbird",NB_DAEMON_ADDR="unix:///run/netbird/netbird.sock",NB_LOG_FILE="console"
directory=/app/data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Connects the daemon and keeps NetBird resources in sync with Cloudron.
; Talks to the daemon socket, so it also runs as root.
[program:router]
command=/app/code/router.py sync
environment=NB_STATE_DIR="/app/data/netbird",NB_DAEMON_ADDR="unix:///run/netbird/netbird.sock"
directory=/app/data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Unprivileged status page; reads the state file the sync loop writes.
[program:status]
command=/app/code/router.py serve
user=cloudron
directory=/app/data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
